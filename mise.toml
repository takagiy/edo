[tools]
# rustup picks the host from its own default, which differs per machine. Windows needs the GNU
# host because build scripts are built for the host, and zig cannot stand in for MSVC.
rust = [
    { version = "1.99", os = ["linux", "macos"], targets = "{{ vars.release_targets }}", components = "rustfmt,clippy" },
    { version = "1.99-x86_64-pc-windows-gnu", os = ["windows"], targets = "{{ vars.release_targets }}", components = "rustfmt,clippy" },
]
# tree-sitter's wasm feature runs cmake in wasmtime-c-api-impl's build script.
cmake = "4"
# Every cargo task goes through cargo-zigbuild, so the C in the tree-sitter grammars and the
# linker come from zig on every OS (on Windows this also stands in for MinGW and dlltool).
zig = "0.17.0"
"cargo:cargo-zigbuild" = "0.24.0"
# Keep in step with the insta dev-dependency in Cargo.toml.
"cargo:cargo-insta" = "1.49.0"

[vars]
# cargo-zigbuild only uses zig when given a target; this is the host's.
target = """\
    {% if os() == 'windows' %}x86_64-pc-windows-gnu\
    {% elif os() == 'macos' %}{% if arch() == 'arm64' %}aarch64{% else %}x86_64{% endif %}-apple-darwin\
    {% else %}{% if arch() == 'arm64' %}aarch64{% else %}x86_64{% endif %}-unknown-linux-gnu\
    {% endif %}"""

# The platforms the release task builds for, comma-separated (mise vars are strings).
release_targets = "x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu"

[tasks.setup]
description = "Fetch the brokk Kotlin grammar submodule"
run = "git submodule update --init --recursive"

[tasks.build]
description = "Build the workspace"
run = "cargo-zigbuild zigbuild --workspace --target {{vars.target}}"

[tasks.test]
description = "Run all tests"
run = "cargo-zigbuild test --workspace --target {{vars.target}}"

[tasks.lint]
description = "Run clippy, failing on warnings"
run = "cargo-zigbuild clippy --workspace --all-targets --target {{vars.target}} -- -D warnings"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.check]
description = "Everything CI should run: formatting, lint and tests"
depends = ["fmt-check", "lint", "test"]

[tasks.snap]
description = "Review pending insta snapshots"
run = "cargo insta review"

[tasks.release]
description = "Build release tarballs for every platform as target/edo-<target>.tar.gz"
# xtask writes the tarballs so the binaries get mode 0755 whatever the host file system is.
run = """\
    {% set targets = vars.release_targets | split(pat=',') %}\
    cargo-zigbuild zigbuild --release --locked{% for t in targets %} --target {{ t }}{% endfor %} \
    && cargo-zigbuild run --quiet --locked --target {{ vars.target }} -p xtask -- package \
    {% for t in targets %} {{ t }}{% endfor %}"""
