[package]
name = "edo"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
edo-lsp-client = { version = "0.1.0", path = "crates/edo-lsp-client" }
edo-tree-sitter-kotlin = { version = "0.4.8", path = "crates/edo-tree-sitter-kotlin" }
flate2 = "1.1.10"
globset = "0.4.21"
ignore = "0.4.34"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "client"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
streaming-iterator = "0.1.9"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
toml = "1.1.8"
tree-sitter = { version = "0.27", features = ["wasm"] }
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = "3.5.0"

[dev-dependencies]
insta = "1.49.0"
lsp-server = "0.10"

[workspace]
members = ["crates/edo-lsp-client", "crates/edo-tree-sitter-kotlin", "crates/xtask"]
